name: Build and Push

on:
  schedule:
    # Daily at 03:00 UTC, just like before
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # Rebuild on patch or workflow changes too, so a new patch lands fast
    paths:
      - '.patches/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream while preserving fork overlay
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Stash fork-only directories before resetting tracked files.
          # These are the only things the fork actually owns:
          #   .patches/  -> patches applied at build time
          #   .github/   -> this workflow itself
          mkdir -p /tmp/fork-overlay
          for dir in .patches .github; do
            if [ -e "$dir" ]; then
              cp -a "$dir" "/tmp/fork-overlay/$dir"
            fi
          done

          # Pull latest upstream
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/nhyyebo/aiopicks.git
          git fetch upstream main

          # Reset working tree + index to upstream
          git reset --hard upstream/main

          # Re-overlay fork-only directories
          for dir in .patches .github; do
            if [ -e "/tmp/fork-overlay/$dir" ]; then
              rm -rf "$dir"
              cp -a "/tmp/fork-overlay/$dir" "$dir"
            fi
          done

          # Commit and push the synced state so the fork visually mirrors
          # upstream (plus overlay). Use --force-with-lease to be safe.
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync upstream + restore fork overlay [skip ci]"
            git push --force origin main
          fi

      - name: Apply patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=( .patches/*.patch )
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "No patches in .patches/ - building unmodified upstream."
            exit 0
          fi
          for patch in "${patches[@]}"; do
            echo "::group::Applying $patch"
            git apply --verbose --check "$patch"
            git apply --verbose "$patch"
            echo "::endgroup::"
          done

      - name: Compute lowercase image tag
        id: imgtag
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.imgtag.outputs.owner }}/aiopicks:latest
            ghcr.io/${{ steps.imgtag.outputs.owner }}/aiopicks:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
